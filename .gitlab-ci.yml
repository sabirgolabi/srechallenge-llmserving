# The "k8s" tag must point to a runner that has kubectl access to the cluster
# (e.g. the tools server). The kubeconfig stays on that runner.
stages: [base, build, deploy, smoke, loadtest]

default:
  tags: [k8s]

base:
  stage: base
  image: alpine/helm:3.17.3
  before_script:
    - apk add --no-cache kubectl
  rules:
    - changes:
        - k8s/namespaces/**/*
        - helm/kps-values.yaml
        - .gitlab/ci/base.yml
  script:
    - kubectl apply -k k8s/namespaces
    - kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.31/deploy/local-path-storage.yaml
    - helm repo add kuberay https://ray-project.github.io/kuberay-helm/ --force-update
    - helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update
    - helm repo update
    - helm upgrade --install kuberay-operator kuberay/kuberay-operator --version 1.3.0 -n kuberay-system --create-namespace
    - helm upgrade --install kps prometheus-community/kube-prometheus-stack --version 92.3.0 -n monitoring --create-namespace -f helm/kps-values.yaml --timeout 10m
build:
  stage: build
  script:
    - |
      IMAGE="${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
      echo "$CI_REGISTRY_PASSWORD" |
        docker login "$CI_REGISTRY" \
          --username "$CI_REGISTRY_USER" \
          --password-stdin

      docker build --platform linux/amd64 \
        -f docker/Dockerfile \
        -t "$IMAGE" docker

      docker push "$IMAGE"
  rules:
    - if: '$CI_COMMIT_TAG'

deploy:
  stage: deploy
  script:
    - |
      IMAGE="${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
      sed -i "s|IMAGE_PLACEHOLDER|${IMAGE}|g" \
        k8s/llm-serving/rayservice.yaml

      kubectl apply -k k8s/ --dry-run=server
      kubectl apply -k k8s/
  rules:
    - if: '$CI_COMMIT_TAG'
# Retries for up to 20 minutes because the model needs a few minutes to start.
smoke:
  stage: smoke
  script:
    - |
      HEAD=$(kubectl get pod -n llm-serving -l ray.io/node-type=head -o name | head -1)
      for i in $(seq 1 60); do
        if kubectl exec -n llm-serving "$HEAD" -- curl -sf -m 120 -X POST \
             http://qwen-llm-serve-svc:8000/generate \
             -H 'Content-Type: application/json' \
             -d '{"prompt":"What is Kubernetes?","max_new_tokens":16}' | grep -q '"text"'; then
          echo "smoke test passed"; exit 0
        fi
        echo "not ready yet ($i/60)"; sleep 20
      done
      echo "smoke test failed"; exit 1
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Manual: run the k6 load test and keep its output as a job artifact.
loadtest:
  stage: loadtest
  when: manual
  script:
    - JOB=$(kubectl create -f loadtest/job.yaml -o name)
    - kubectl wait --for=condition=complete "$JOB" -n monitoring --timeout=30m
    - kubectl logs -n monitoring "$JOB" | tee k6-result.txt
  artifacts:
    paths: [k6-result.txt]
    expire_in: 30 days
