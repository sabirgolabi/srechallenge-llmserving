apiVersion: v1
kind: Service
metadata:
  name: qwen-llm-nodeport
  namespace: llm-serving
spec:
  type: NodePort
  selector:
    ray.io/serve: "true"
    ray.io/node-type: worker
  ports:
    - name: serve
      port: 8000
      targetPort: 8000
      nodePort: 30800
---
apiVersion: v1
kind: Service
metadata:
  name: qwen-dashboard-nodeport
  namespace: llm-serving
spec:
  type: NodePort
  selector:
    ray.io/node-type: head
  ports:
    - name: dashboard
      port: 8265
      targetPort: 8265
      nodePort: 30265
